# Included in every location of nginx.conf: an add_header inside a location
# replaces all server-level ones, so they can't simply live in `server {}`.

# Only our own scripts plus Telegram's SDK; no inline or eval'd code, so an
# injected <script> can't run. Styles allow inline (TON Connect UI and React
# style attributes need it). connect-src stays open to any https/wss host:
# the API, the game socket and TON Connect's many wallet bridges live on
# other origins. Telegram Web is the only site allowed to frame the app.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org" always;

# Don't guess content types (a JSON or image can't be run as a script).
add_header X-Content-Type-Options "nosniff" always;

# Full URL only to our own origin; other sites see just the origin.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing here uses the camera, mic or location; clipboard is used (copy).
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), clipboard-write=(self)" always;
