include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

stages:
  - build
  - test
  - secret-detection
  - docker
  - scan

# Compute-minute budget (free tier, 400 min/month):
#   push to main  -> frontend:build (format, lint, audit, test, build in one job),
#                    secret detection, docker image
#   dev, other branches, merge requests -> no pipeline;
#                    run one by hand via Build > Pipelines > Run pipeline
#   schedule / tag -> heavy scanners: SAST, dependency and container scanning
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables: { SAST_DISABLED: "false", DEPENDENCY_SCANNING_DISABLED: "false" }
    - if: $CI_COMMIT_TAG
      variables: { SAST_DISABLED: "false", DEPENDENCY_SCANNING_DISABLED: "false" }
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  # Turned back on for schedules and tags by workflow:rules above
  # (or by hand: set them to "false" in the Run pipeline form).
  SAST_DISABLED: "true"
  DEPENDENCY_SCANNING_DISABLED: "true"

default:
  interruptible: true

# The template puts this job into the "test" stage; move it to our own stage.
secret_detection:
  stage: secret-detection

# Scan the frontend image: the one just pushed on a tag, :latest on a schedule.
container_scanning:
  stage: scan
  needs:
    - job: frontend:docker
      optional: true
  variables:
    CS_IMAGE: $CI_REGISTRY_IMAGE/frontend:latest
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_TAG
      variables: { CS_IMAGE: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_TAG }

# ---------- frontend ----------
# One job instead of lint/build/test/audit: dependencies are installed once.
frontend:build:
  image: oven/bun:1.4.4
  stage: build
  variables:
    BUN_INSTALL_CACHE_DIR: $CI_PROJECT_DIR/.bun-cache
  cache:
    key:
      files: [frontend/bun.lock]
      prefix: bun
    paths: [.bun-cache/]
  before_script:
    - cd frontend
    - bun install --frozen-lockfile
  script:
    - bun run format:check
    - bun run lint
    # GitLab's dependency scanner may not read bun.lock, so audit with bun itself.
    - bun audit --prod --audit-level=high
    - bun run test
    - bun run i18n:compile
    - bun run build
  artifacts:
    paths: [frontend/dist/]
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes: [frontend/**/*, .gitlab-ci.yml]

# ---------- docker images (push to GitLab registry on default branch / tags) ----------
# Only :latest (plus :<git-tag> for releases) is pushed, so the registry holds
# one image per app; the previous :latest becomes untagged and is cleaned up.
.docker:
  stage: docker
  image: docker:27
  services: [docker:27-dind]
  interruptible: false # don't let a newer pipeline cancel a push halfway
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - IMAGE=$CI_REGISTRY_IMAGE/$APP
    - TAGS="-t $IMAGE:latest"
    - if [ -n "$CI_COMMIT_TAG" ]; then TAGS="$TAGS -t $IMAGE:$CI_COMMIT_TAG"; fi
    - docker build $BUILD_ARGS $TAGS $APP
    - docker push --all-tags $IMAGE

frontend:docker:
  extends: .docker
  variables:
    APP: frontend
    BUILD_ARGS: --target prebuilt --build-arg VITE_APP_URL=$VITE_APP_URL --build-arg VITE_API_URL=$VITE_API_URL
  needs: [frontend:build]
  before_script:
    - '[ -n "$VITE_APP_URL" ] || { echo "VITE_APP_URL is not set (Settings > CI/CD > Variables)"; exit 1; }'
    - !reference [.docker, before_script]
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG)
      changes: [frontend/**/*]

# Everything (deps, compile) happens inside backend/Dockerfile; CI only runs docker build + push.
backend:docker:
  extends: .docker
  needs: [] # start immediately, don't download artifacts from other jobs
  variables:
    APP: backend # build context = backend/, Dockerfile = backend/Dockerfile
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG)
      exists: [backend/Dockerfile]
      changes: [backend/**/*]

# ---------- GitLab Pages ----------
# Rules MUST match frontend:build (same changes), otherwise "needs" points to a
# job that doesn't exist and the whole pipeline fails to create.
pages:
  stage: docker
  needs: [frontend:build]
  interruptible: false
  script:
    - mkdir -p public
    - cp -r frontend/dist/* public/
  artifacts:
    paths: [public]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [frontend/**/*, .gitlab-ci.yml]
