include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

stages:
  - build
  - test
  - secret-detection
  - docker
  - scan

# Compute-minute budget (free tier, 400 min/month):
#   push to main    -> build only: frontend build, docker images, Cloudflare Pages
#   push to release -> everything: format, lint, audit, tests, secret detection,
#                      SAST, dependency and container scanning
#   schedule / tag  -> everything as well
#   dev, other branches, merge requests -> no pipeline;
#                      run one by hand via Build > Pipelines > Run pipeline
#                      (set FULL_CHECKS to "true" in the form for all checks)
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables: &full_checks
        FULL_CHECKS: "true"
        SAST_DISABLED: "false"
        DEPENDENCY_SCANNING_DISABLED: "false"
    - if: $CI_COMMIT_TAG
      variables: *full_checks
    - if: $CI_COMMIT_BRANCH == $RELEASE_BRANCH
      variables: *full_checks
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  RELEASE_BRANCH: release
  # Switched on for release, schedules and tags by workflow:rules above.
  FULL_CHECKS: "false"
  SAST_DISABLED: "true"
  DEPENDENCY_SCANNING_DISABLED: "true"

default:
  interruptible: true

# The template puts this job into the "test" stage; move it to our own stage.
secret_detection:
  stage: secret-detection
  rules:
    - if: $FULL_CHECKS == "true"

# Scan the backend image: the one just pushed on a tag, :latest on a schedule.
# The frontend has no image: it is static and lives on Cloudflare Pages.
container_scanning:
  stage: scan
  needs:
    - job: backend:docker
      optional: true
  variables:
    CS_IMAGE: $CI_REGISTRY_IMAGE/backend:latest
  rules:
    - if: $CI_COMMIT_TAG
      variables: { CS_IMAGE: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_TAG }
    - if: $FULL_CHECKS == "true"

# ---------- frontend ----------
# One job instead of lint/build/test/audit: dependencies are installed once.
# On main it only builds; with FULL_CHECKS it also runs format, lint, audit, tests.
frontend:build:
  image: oven/bun:1.4.4
  stage: build
  variables:
    BUN_INSTALL_CACHE_DIR: $CI_PROJECT_DIR/.bun-cache
  cache:
    key:
      files: [frontend/bun.lock]
      prefix: bun
    paths: [.bun-cache/]
  before_script:
    - cd frontend
    - bun install --frozen-lockfile
  script:
    - |
      if [ "$FULL_CHECKS" = "true" ]; then
        bun run format:check
        bun run lint
        # GitLab's dependency scanner may not read bun.lock, so audit with bun itself.
        bun audit --prod --audit-level=high
        bun run test
      fi
    - bun run i18n:compile
    - bun run build
  artifacts:
    paths: [frontend/dist/]
    expire_in: 1 day
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - changes: [frontend/**/*, .gitlab-ci.yml]

# ---------- docker images (push to GitLab registry on default branch / tags) ----------
# Only :latest (plus :<git-tag> for releases) is pushed, so the registry holds
# one image per app; the previous :latest becomes untagged and is cleaned up.
.docker:
  stage: docker
  image: docker:27
  services: [docker:27-dind]
  interruptible: false # don't let a newer pipeline cancel a push halfway
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - IMAGE=$CI_REGISTRY_IMAGE/$APP
    - TAGS="-t $IMAGE:latest"
    - if [ -n "$CI_COMMIT_TAG" ]; then TAGS="$TAGS -t $IMAGE:$CI_COMMIT_TAG"; fi
    - docker build $BUILD_ARGS $TAGS $APP
    - docker push --all-tags $IMAGE

# Everything (deps, compile) happens inside backend/Dockerfile; CI only runs docker build + push.
backend:docker:
  extends: .docker
  needs: [] # start immediately, don't download artifacts from other jobs
  variables:
    APP: backend # build context = backend/, Dockerfile = backend/Dockerfile
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG)
      exists: [backend/Dockerfile]
      changes: [backend/**/*]

# chain-service (Go): the Dockerfile builds a static binary in a scratch image.
chain-service:docker:
  extends: .docker
  needs: []
  variables:
    APP: chain-service
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG)
      changes: [chain-service/**/*]

# ---------- Cloudflare Pages (production frontend) ----------
# Uploads frontend/dist to the Cloudflare Pages project. Runs only when the
# Cloudflare variables are set (Settings > CI/CD > Variables, masked + protected):
#   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID
#   CF_PAGES_PROJECT       Pages project name (the job creates it if missing;
#                          a Worker with the same name is a different thing)
# The build reads VITE_APP_URL, VITE_API_URL, VITE_MOCK_SERVER=false and
# VITE_TON_NETWORK from the same CI/CD variables. Rules MUST match frontend:build.
frontend:cloudflare-pages:
  stage: docker
  image: node:22-alpine
  needs: [frontend:build]
  interruptible: false
  script:
    - '[ ! -e frontend/dist/404.html ] || { echo "404.html disables SPA fallback on Pages"; exit 1; }'
    # Creates the Pages project on the first run; later runs fail here harmlessly ("already exists").
    - npx --yes wrangler@4 pages project create "$CF_PAGES_PROJECT" --production-branch="$CI_DEFAULT_BRANCH" || true
    - npx --yes wrangler@4 pages deploy frontend/dist --project-name="$CF_PAGES_PROJECT" --branch="$CI_COMMIT_BRANCH" --commit-hash="$CI_COMMIT_SHA"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CLOUDFLARE_API_TOKEN == null || $CLOUDFLARE_ACCOUNT_ID == null || $CF_PAGES_PROJECT == null
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [frontend/**/*, .gitlab-ci.yml]
