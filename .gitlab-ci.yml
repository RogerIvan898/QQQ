include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml

stages:
  - lint
  - build
  - test
  - secret-detection
  - docker
  - scan

# Scan the freshly pushed frontend image (runs only when the image was built).
container_scanning:
  stage: scan
  needs: [frontend:docker]
  variables:
    CS_IMAGE: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
  rules:
    - if: ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG)
      changes: [frontend/**/*]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  interruptible: true

# ---------- frontend ----------
.frontend:
  image: node:22-alpine
  before_script:
    - npm i -g bun@1.3.14
    - cd frontend
    - bun install --frozen-lockfile
  cache:
    key:
      files: [frontend/bun.lock]
    paths: [frontend/node_modules/]
  rules:
    - changes: [frontend/**/*, .gitlab-ci.yml]

frontend:lint:
  extends: .frontend
  stage: lint
  script:
    - bun run format:check
    - bun run lint

frontend:build:
  extends: .frontend
  stage: build
  script:
    - bun run i18n:compile
    - bun run build
  artifacts:
    paths: [frontend/dist/]
    expire_in: 1 week

frontend:test:
  extends: .frontend
  stage: test
  needs: []
  script:
    - bun run test

# GitLab's dependency scanner may not read bun.lock, so audit with bun itself.
# Non-blocking for now: there are known high-severity advisories to triage.
frontend:audit:
  extends: .frontend
  stage: test
  needs: []
  allow_failure: true
  script:
    - bun audit --prod --audit-level=high

# ---------- backend (C++, CMake) ----------
# Dormant until backend/CMakeLists.txt exists.
.backend:
  image: gcc:14
  variables:
    BUILD_DIR: backend/build
  before_script:
    - apt-get update -qq && apt-get install -y -qq cmake ninja-build >/dev/null
  rules:
    - exists: [backend/CMakeLists.txt]
      changes: [backend/**/*, .gitlab-ci.yml]

backend:build:
  extends: .backend
  stage: build
  script:
    - cmake -S backend -B $BUILD_DIR -G Ninja -DCMAKE_BUILD_TYPE=Release
    - cmake --build $BUILD_DIR -j
  artifacts:
    paths: [backend/build/]
    expire_in: 1 day

backend:test:
  extends: .backend
  stage: test
  needs: [backend:build]
  script:
    - ctest --test-dir $BUILD_DIR --output-on-failure

# ---------- docker images (push to GitLab registry on default branch / tags) ----------
.docker:
  stage: docker
  image: docker:27
  services: [docker:27-dind]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - IMAGE=$CI_REGISTRY_IMAGE/$APP
    - TAGS="-t $IMAGE:$CI_COMMIT_SHORT_SHA -t $IMAGE:latest"
    - if [ -n "$CI_COMMIT_TAG" ]; then TAGS="$TAGS -t $IMAGE:$CI_COMMIT_TAG"; fi
    - docker build $BUILD_ARGS $TAGS $APP
    - docker push --all-tags $IMAGE

frontend:docker:
  extends: .docker
  variables:
    APP: frontend
    BUILD_ARGS: --target prebuilt
  needs: [frontend:lint, frontend:test, frontend:build]
  before_script:
    - '[ -n "$VITE_APP_URL" ] || { echo "VITE_APP_URL is not set (Settings > CI/CD > Variables)"; exit 1; }'
    - !reference [.docker, before_script]
  rules:
    - if: ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG)
      changes: [frontend/**/*]

backend:docker:
  extends: .docker
  variables: { APP: backend }
  rules:
    - if: ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG)
      exists: [backend/Dockerfile]
      changes: [backend/**/*]
